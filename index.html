<style>
:root{--p1:#064e3b;--p2:#047857;--acc:#10b981;--bg:#f0fdf4;--card:#fff;--txt:#10261e;--mut:#5b7068;--bd:#d1fae5;
--sh:0 10px 30px -10px rgba(6,78,59,.25)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Plus Jakarta Sans','Anek Bangla',sans-serif;background:var(--bg);color:var(--txt);line-height:1.6;min-height:100vh;
background-image:radial-gradient(circle at 10% 0%,#d1fae5 0,transparent 40%),radial-gradient(circle at 90% 20%,#a7f3d0 0,transparent 35%);background-attachment:fixed}
body.bn{font-family:'Anek Bangla','Plus Jakarta Sans',sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}

/* Top bar + language toggle */
.topbar{display:flex;justify-content:flex-end;padding:14px 0 0}
.lang{display:inline-flex;background:rgba(255,255,255,.8);backdrop-filter:blur(8px);border:1px solid var(--bd);border-radius:999px;padding:4px;box-shadow:var(--sh)}
.lang button{border:0;background:none;padding:6px 16px;border-radius:999px;font:inherit;font-weight:600;font-size:.9rem;color:var(--p2);cursor:pointer;transition:.25s}
.lang button.on{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff}

/* Header */
header{text-align:center;padding:18px 0 8px}
header .logo{height:84px;max-width:100%;object-fit:contain}
.coach{margin-top:6px;font-weight:700;color:var(--p2);letter-spacing:.3px}
h1{margin:10px auto 0;font-size:clamp(1.15rem,4.4vw,1.8rem);line-height:1.4;color:var(--p1);font-weight:800;white-space:pre-line}
h1::first-line{font-size:1.15em}
.guide{margin:18px auto 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;
background:rgba(255,255,255,.7);backdrop-filter:blur(8px);border:1px dashed var(--acc);border-radius:16px;padding:12px 14px}
.guide p{font-size:.92rem;color:var(--mut)}

/* Buttons */
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 20px;cursor:pointer;transition:.25s;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-main{background:linear-gradient(135deg,var(--p2),var(--acc));color:#fff;width:100%;padding:15px;font-size:1.05rem;box-shadow:0 8px 20px -6px rgba(4,120,87,.6)}
.btn-main:hover{transform:translateY(-2px);box-shadow:0 14px 26px -8px rgba(4,120,87,.7)}
.btn-main:active{transform:scale(.98)}
.btn-ghost{background:#ecfdf5;color:var(--p2);border:1px solid var(--bd);padding:8px 16px;font-size:.9rem}
.btn-ghost:hover{background:var(--p2);color:#fff}

/* Cards */
.card{background:var(--card);border-radius:20px;padding:22px;box-shadow:var(--sh);border:1px solid var(--bd);margin-top:20px}
label{display:block;font-weight:600;margin-bottom:6px;color:var(--p1)}
.field{margin-bottom:16px}
input{width:100%;padding:14px 16px;font:inherit;font-size:1.1rem;border:2px solid var(--bd);border-radius:12px;background:#f8fffb;transition:.2s}
input:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 4px rgba(16,185,129,.18);background:#fff}
input.err{border-color:#dc2626;background:#fef2f2}
.msg{color:#dc2626;font-size:.85rem;min-height:1.2em;margin-top:4px}

/* Result */
#result{display:none}
#result.show{display:block;animation:up .6s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.hero{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;border-radius:20px;padding:26px 20px;text-align:center;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero small{opacity:.85;font-size:.95rem}
.big{font-size:clamp(2.2rem,10vw,3.4rem);font-weight:800;line-height:1.2;margin:4px 0 12px}
.big .of{font-size:.45em;opacity:.8;font-weight:600}
.bar{height:12px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#a7f3d0,#fff);border-radius:99px;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.pct{margin-top:6px;font-size:.9rem;opacity:.9}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.mini .card{margin:0;padding:18px}
.mini h3{font-size:.95rem;color:var(--p2)}
.mini b{display:block;font-size:1.7rem;color:var(--p1);margin:2px 0}
.mini b span{font-size:.6em;color:var(--mut);font-weight:600}
.mini p{font-size:.8rem;color:var(--mut)}
.actions{display:flex;justify-content:center;margin-top:14px}

/* Promo */
.promo{text-align:center;background:linear-gradient(180deg,#fff,#ecfdf5)}
.promo p.hook{font-weight:600;color:var(--p1);font-size:1.05rem;margin-bottom:14px}
.promo img{width:100%;max-width:420px;border-radius:16px;box-shadow:var(--sh);display:block;margin:0 auto 16px}
.cta{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#3b2400;box-shadow:0 8px 20px -6px rgba(245,158,11,.7)}
.cta:hover{transform:translateY(-2px)}

/* How it's calculated */
details{margin-top:20px}
summary{cursor:pointer;font-weight:700;color:var(--p1);padding:2px 0}
.how{margin-top:14px;font-size:.95rem}
.how h4{color:var(--p1);margin:16px 0 6px;font-size:1.02rem}
.how p,.how li{margin:6px 0;color:var(--txt)}
.how ul{list-style:none;padding:0}
.how li{padding-left:1.6em;position:relative}
.how li::before{content:attr(data-m);position:absolute;left:0;color:var(--p2);font-weight:700}
.how .eq{background:#ecfdf5;border:1px solid var(--bd);border-radius:10px;padding:8px 12px;font-weight:600;color:var(--p1)}

/* Footer */
footer{margin-top:40px;background:linear-gradient(160deg,#022c22,var(--p1));color:#d1fae5;text-align:center;padding:34px 16px 24px;border-radius:28px 28px 0 0}
footer .flogo{background:#fff;border-radius:14px;padding:8px 14px;display:inline-flex;align-items:center;gap:12px}
footer .flogo img{height:44px}
footer h4{color:#fff;margin:12px 0 8px;font-size:1.1rem}
footer a{color:#a7f3d0;text-decoration:none}
footer a:hover{text-decoration:underline}
footer .ln{margin:8px 0;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.ico{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--p2),var(--acc));color:#fff;box-shadow:0 4px 12px -2px rgba(16,185,129,.6)}
.fb{background:#1877f2;color:#fff!important;margin-top:14px;box-shadow:0 8px 20px -6px rgba(24,119,242,.6)}
.fb:hover{transform:translateY(-2px);text-decoration:none!important}
.visitors{margin:18px auto 0;display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);padding:6px 16px;border-radius:99px;font-size:.92rem}
.visitors b{color:#fff;font-size:1.05rem}
.copy{margin-top:16px;font-size:.78rem;opacity:.6}

/* Toast */
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,40px);background:var(--p1);color:#fff;padding:10px 22px;border-radius:99px;opacity:0;pointer-events:none;transition:.35s;z-index:9;font-weight:600}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media(max-width:520px){.mini{grid-template-columns:1fr}.card{padding:18px}header .logo{height:68px}}
</style>
</head>

T.bn.howHtml=`<h4>কিভাবে প্রস্তুত করা হয় বিইউপির ফলাফল!</h4>
<p><b>SSC+HSC তে প্রাপ্ত মার্কস, Written Marks (MCQ) সবকিছু মিলিয়ে চূড়ান্ত ফলাফল প্রকাশ করা হয়।</b></p>

<h4>উল্লেখ্য,</h4>
<ul><li data-m="✓">এসএসসিতে সর্বমোট যে মার্কস পেয়েছো, সেটিকে ২০%-এ কনভার্ট করা হবে।</li>
<li data-m="✓">এইচএসসিতে সর্বমোট যে মার্কস পেয়েছো, সেটিকে ২৫%-এ কনভার্ট করা হবে।</li>
<li data-m="✓"><b>সর্বমোট: ২০% + ২৫% = ৪৫%</b></li>
<li data-m="☐">Written Marks (MCQ)-কে 55%-এ Convert করা হবে।</li></ul>
<p class="eq">অর্থাৎ, (Written-MCQ) 55 + 45 (SSC+HSC) = Total: 100</p>
<h4>এসএসসি ও এইচএসসির হিসাবঃ</h4>
<ul><li data-m="☐">বিইউপি সাধারণত এসএসসি থেকে শারীরিক শিক্ষা ও ক্যারিয়ার শিক্ষার সর্বমোট (১০০+৫০=১৫০) ও চতুর্থ বিষয়ের জন্য ৪০ বাদ দেয়। অর্থাৎ সর্বমোট বাদ যাচ্ছে, ১৫০+৪০=১৯০। সর্বশেষ মার্কস থাকছে = ১৩০০−১৯০ = <b>১১১০</b></li>

<h4>SSC &amp; HSC calculation:</h4>

/* ============ Digit helpers ============ */
const BN='০১২৩৪৫৬৭৮৯';
const toEn=s=>String(s).replace(/[০-৯]/g,d=>BN.indexOf(d)).replace(/[,\s]/g,'').replace('।','.');
const fmt=n=>{const s=n.toFixed(2);return lang==='bn'?s.replace(/\d/g,d=>BN[d]):s};

/* ============ Language ============ */
function applyLang(){
  const t=T[lang];
  document.body.classList.toggle('bn',lang==='bn');
  document.documentElement.lang=lang==='bn'?'bn':'en';
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t[e.dataset.i18n]);
  document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t[e.dataset.ph]);
  $('howBody').innerHTML=t.howHtml;
  $('bnBtn').classList.toggle('on',lang==='bn');$('enBtn').classList.toggle('on',lang==='en');
  document.title=lang==='bn'?'BUP একাডেমিক মার্কস ক্যালকুলেটর | RoadMap':'BUP Academic Marks Calculator | RoadMap';
  if(last)render(); // re-render numbers in the chosen digit style
  clearErr();
  loadVisitors.fmt&&loadVisitors.fmt();
}
$('bnBtn').onclick=()=>{lang='bn';localStorage.setItem('rm_lang',lang);applyLang()};
$('enBtn').onclick=()=>{lang='en';localStorage.setItem('rm_lang',lang);applyLang()};

/* ============ Validation + calculation ============ */
function clearErr(){['ssc','hsc'].forEach(k=>{$(k).classList.remove('err');$(k+'Err').textContent=''})}
function check(id){
  const t=T[lang],raw=$(id).value.trim();let m='';
  if(!raw)m=t.eEmpty;
  else{const v=parseFloat(toEn(raw));
    if(!/^\d+(\.\d+)?$/.test(toEn(raw))||isNaN(v))m=t.eNum;
    else if(v<190||v>1300)m=t.eRange;
    else return v}
  $(id).classList.add('err');$(id+'Err').textContent=m;return null;
}
function calc(){
  clearErr();
  const s=check('ssc'),h=check('hsc');
  if(s===null||h===null)return;
  // SSC: 20% weight, base 1300-190=1110 | HSC: 25% weight, base 1300-80=1220
  const sscS=+(((s-190)*20)/1110).toFixed(2);
  const hscS=+(((h-80)*25)/1220).toFixed(2);
  last={sscS,hscS,total:+(sscS+hscS).toFixed(2)};
  render();
  const r=$('result');r.classList.remove('show');void r.offsetWidth;r.classList.add('show');
  setTimeout(()=>r.scrollIntoView({behavior:'smooth',block:'start'}),80);
}
function render(){
  $('sscS').textContent=fmt(last.sscS);$('hscS').textContent=fmt(last.hscS);$('total').textContent=fmt(last.total);
  const p=Math.min(100,last.total/45*100);
  $('pct').textContent=fmt(p)+'%';
  $('barFill').style.width='0';requestAnimationFrame(()=>requestAnimationFrame(()=>$('barFill').style.width=p+'%'));
}

/* ============ Buttons ============ */
$('calcBtn').onclick=calc;
['ssc','hsc'].forEach(id=>{
  // normalise Bengali digits as the user types
  $(id).addEventListener('input',e=>{const el=e.target;el.value=el.value.replace(/[০-৯]/g,d=>BN.indexOf(d));el.classList.remove('err');$(id+'Err').textContent=''});
  $(id).addEventListener('keydown',e=>{if(e.key==='Enter')calc()});
});
$('exBtn').onclick=()=>{$('ssc').value='1219';$('hsc').value='1171';calc()};
$('resetBtn').onclick=()=>{$('ssc').value='';$('hsc').value='';clearErr();last=null;$('result').classList.remove('show')};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}
$('copyBtn').onclick=async()=>{
  if(!last)return;
  const txt=T[lang].cp(fmt(last.sscS),fmt(last.hscS),fmt(last.total));
  try{await navigator.clipboard.writeText(txt)}catch(_){
    const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}
  toast(T[lang].copied);
};

/* ============ Visitor counter ============
   Uses the free counterapi.dev service (counts once per browser session).
   If the service is unreachable the number shows "—" and nothing else breaks.
   Change NS/KEY if you want a fresh counter. */
